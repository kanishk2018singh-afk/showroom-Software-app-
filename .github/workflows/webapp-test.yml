name: Web App Smoke Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Typecheck
        run: npm run typecheck
      - name: Smoke test (billing engine + UI flow)
        run: npm run smoke
      - name: Production build
        run: npm run build
